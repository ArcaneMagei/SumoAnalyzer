# Docker Compose for macOS (M3 Pro with Metal)
# Use: docker compose -f docker-compose.mac.yml up

version: '3.8'

services:
  sumo-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: sumo-analyzer:latest
    container_name: sumo-analyzer
    
    ports:
      - "8501:8501"
    
    volumes:
      - ./data/input:/app/data/input
      - ./data/output:/app/data/output
      - ./logs:/app/logs
      - ./models/weights:/app/models/weights
    
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # Enable Metal Performance Shaders for M1/M2/M3
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    
    # No GPU section needed - Metal acceleration is automatic in PyTorch
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
